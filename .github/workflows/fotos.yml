# Descarga las fotos de los destinos desde Wikimedia Commons y las sube al repo.
# Corre cuando cambia la lista de artículos (data/base/fotos-wiki.json) o el script.
name: Fotos de destinos

on:
  push:
    branches: [main]
    paths:
      - data/base/fotos-wiki.json
      - scripts/fotos.js
      - .github/workflows/fotos.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fotos
  cancel-in-progress: false

jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save sharp@0.33.5
      - run: node scripts/fotos.js
      - name: Subir fotos nuevas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/destinos data/fuentes/fotos.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Fotos de destinos desde Wikimedia Commons"
          git pull --rebase origin main
          git push origin HEAD:main

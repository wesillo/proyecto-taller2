<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Fly4ward</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='3' fill='%23FFCC00'/%3E%3Cpath fill='none' stroke='%23000' stroke-width='3' d='M5 12h13M12 6l6 6-6 6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/styles.css">
<style>
  h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.05;margin:0 0 12px}
  p{font-size:17px}
  .opts-donde{display:grid;gap:10px;margin:18px 0}
  .opts-donde .btn{justify-content:flex-start}
  .ok{color:var(--verde);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="brand" href="./" style="color:inherit;text-decoration:none"><span class="mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"><path d="M4 12h14M12 5l7 7-7 7"/></svg></span>Fly4ward</a>
  </div>
  <main id="app" aria-live="polite"><p>…</p></main>
</div>
<script src="js/negocio.js"></script>
<script src="js/datos.js"></script>
<script>
const q = new URLSearchParams(location.search);
const cupon = (q.get("c") || "").toUpperCase();
const resp = q.get("r");
const en = q.get("lang") === "en";
document.documentElement.lang = en ? "en" : "es";
const L = (es, eng) => (en ? eng : es);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const app = document.getElementById("app");
const urlApp = "./" + (en ? "?lang=en" : "");

const enviar = (extra) => fetch(URL_HOJA + "?" + new URLSearchParams({ accion: "seguimiento", cupon, ...extra })).then((r) => r.json());

const DONDE = [
  ["agencia", L("En una agencia de viajes", "At a travel agency")],
  ["aerolinea", L("Directo con la aerolínea", "Directly with the airline")],
  ["skyscanner", "Skyscanner"],
  ["despegar", "Despegar"],
  ["otro", L("En otro lado", "Somewhere else")],
];

function gracias(destino) {
  app.innerHTML = `<h1>${L("¡Gracias!", "Thank you!")}</h1><p>${L("Nos ayuda muchísimo para mejorar Fly4ward.", "It really helps us improve Fly4ward.")}</p><a class="btn btn-primary" href="${urlApp}">${L("Ir a Fly4ward", "Go to Fly4ward")}</a>`;
}

async function iniciar() {
  if (!esCupon(cupon) || !["si", "aun_no", "no", "baja"].includes(resp)) {
    app.innerHTML = `<h1>${L("Este enlace no es válido", "This link isn't valid")}</h1><a class="btn btn-primary" href="${urlApp}">${L("Ir a Fly4ward", "Go to Fly4ward")}</a>`;
    return;
  }
  let r = {};
  try { r = await enviar({ r: resp }); } catch (e) {}
  const destino = r.destino ? esc(r.destino) : L("tu destino", "your destination");
  if (resp === "baja") {
    app.innerHTML = `<h1>${L("Listo", "Done")}</h1><p>${L("No te enviaremos más correos.", "We won't email you again.")}</p>`;
  } else if (resp === "si") {
    app.innerHTML = `<h1>${L(`¡Qué bueno! Que disfrutes ${destino}`, `Great! Enjoy ${destino}`)}</h1>
      <p>${L("Una última pregunta: ¿dónde lo compraste?", "One last question: where did you book it?")}</p>
      <div class="opts-donde">${DONDE.map(([v, t]) => `<button class="btn btn-ghost btn-block" data-v="${v}">${t}</button>`).join("")}</div>`;
    app.querySelectorAll("[data-v]").forEach((b) => (b.onclick = async () => {
      app.querySelectorAll("[data-v]").forEach((x) => (x.disabled = true));
      try { await enviar({ donde: b.dataset.v }); } catch (e) {}
      gracias();
    }));
  } else if (resp === "aun_no") {
    app.innerHTML = `<h1>${L("¡Gracias por contarnos!", "Thanks for letting us know!")}</h1>
      <p>${L(`Tu código <b>${esc(cupon)}</b> para ${destino} sigue guardado. Cuando quieras, puedes volver a ver tu destino o buscar otro.`, `Your code <b>${esc(cupon)}</b> for ${destino} is still saved. Whenever you want, you can look at your destination again or find another one.`)}</p>
      <a class="btn btn-primary" href="${urlApp}">${L("Ir a Fly4ward", "Go to Fly4ward")}</a>`;
  } else {
    gracias();
  }
}
iniciar();
</script>
</body>
</html>
